<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="Dreallogin.css" />
    <title>Login</title>
  </head>
  <header>
    <div class="container">
      <div class="header-container">
        <div class="logo-section">
          <!--Logo Image Section-->
          <img src="Dolly.png" alt="company-logo" class="website-logo" />
          <!--Company Name Section-->
          <h1 class="company-name">Dreal</h1>
        </div>
        <nav>
          <ul>
            <li><a href="Dreal.html">Home</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="create.html">Create Account</a></li>
            <li><a href="Dreallogin.html">Login</a></li>
            <li><a href="#Socials">Socials</a></li>
            <li><a href="#Support">Support</a></li>
            <li><a href="#Features"></a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <body>
    <main class="loginbox-container">
      <!-- Login box -->
      <section id="login" class="loginbox-section">
        <div class="logo-container">
          <img src="Dolly.png" alt="company-logo" class="login-page-logo" />

          <div class="head-of-loginpage">
            <p>Dreal</p>
          </div>
        </div>

        <div class="WELCOME">
          <p>Welcome Back!</p>
          <p>Sign in to use your account</p>
        </div>

        <div class="login-form">
          <form>
            <label>Email Address</label>
            <input
              type="email"
              placeholder="e.g-adam45adan7@dreal.com"
              required
            />

            <label>Password</label>
            <input type="password" placeholder="Your password" required />

            <button type="submit">Sign In</button>

            <a href="#Forgot password?">Forgot password?</a>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
