<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="create.css" />
    <title>Create Account</title>
  </head>
  <header>
    <div class="container">
      <div class="header-container">
        <div class="logo-container">
          <img src="Dolly.png" alt="Dreal-logo" class="company-logo" />
          <h1 class="company-name">Dreal</h1>
        </div>
        <nav>
          <ul>
            <li><a href="Dreal.html">Home</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="create.html">Create Account</a></li>
            <li><a href="Dreallogin.html">Login</a></li>
            <li><a href="#Socials">Socials</a></li>
            <li><a href="#Support">Support</a></li>
            <li><a href="Features"></a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <body>
    <main class="create-container">
      <section id="Create Account" class="createbox-container">
        <div class="logo-container">
          <img src="Dolly.png" alt="Dreal-logo" class="companycreate-logo" />
          <h1 class="companycreate-name">Dreal</h1>
        </div>
        <div class="create-head">
          <h3>Create a new account or</h3>
          <p><a href="loginpage.html">Login here</a></p>
        </div>
        <div class="information-form">
          <form>
            <label for="Name">Name</label>
            <input type="text" id="name" placeholder="your fullname" required />
            <label for="Phone Number">Number</label>
            <input type="tel" id="Number" placeholder="080XXXXXXXX" required />
            <label for="Email Address">Email Address</label>
            <input
              type="text"
              id="email"
              placeholder="eg-adam45adan7@dreal.com"
              required
            />
            <label for="Username">Choose Username</label>
            <input
              type="username"
              id="username"
              placeholder="dollysznn"
              required
            />
            <label for="Gender">Gender</label>
            <select id="gender" required>
              <option value="">Choose</option>
              <option value="male">male</option>
              <option value="female">female</option>
            </select>
            <label for="Upload Files">Upload Files</label>
            <input type="file" id="files" required />

            <button>Create Account</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
